<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

 <!-- 按语言切换 CJK 地区字形（日/韩/繁中） -->
 <!--无衬日文-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ja</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK JP</string>
  </edit>
 </match>
 
 <!--无衬韩文-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ko</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK KR</string>
  </edit>
 </match>

<!--无衬台湾繁体--> 
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-tw</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK TC</string>
  </edit>
 </match>
 
 <!--无衬香港繁体-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-hk</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK HK</string>
  </edit>
 </match>

 <!-- 衬线的地区变体：日/韩用对应 Noto Serif，繁中延续楷体审美 -->
 <!--衬线日本-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ja</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK JP</string>
  </edit>
 </match>
 
 <!--衬线韩国-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ko</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK KR</string>
  </edit>
 </match>
 
 <!--衬线台湾繁体-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-tw</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>
 
 <!--衬线香港繁体-->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-hk</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>
 
 <!-- 默认无衬线字体：MiSans（简中或未指定语言时生效）-->
 <match target="pattern">
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>MiSans</string>
  </edit>
 </match>

 <!-- 默认衬线字体 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>Noto Serif CJK SC</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <!-- 默认等宽字体 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>monospace</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>JetBrains Mono Nerd Font Mono</string>
  </edit>
 </match>

 <!-- system-ui 使用我们定义的无衬线字体，必须，否则部分插件会出现豆腐块 -->
 <match target="pattern">
  <test name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>sans-serif</string>
  </edit>
 </match>

 <!-- Map BlinkMacSystemFont (常见于网页识别到apple color emoji的字体栈) 到我们偏好的字体 -->
 <match target="pattern">
  <test name="family">
   <string>BlinkMacSystemFont</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>MiSans</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <!-- This font is causing problem with GitHub -->
     <string>Nimbus Sans</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>

<!-- 渲染设置，一般适用于4k之下的显示屏 -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>

</fontconfig>
