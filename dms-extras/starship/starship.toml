"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[╭─](bold blue)$username$hostname$directory$git_branch
[╰─](bold blue)$line_break"""

[username]
show_always = false
style_user = "bold blue"
style_root = "bold red"
format = '[$user]($style) '

[hostname]
ssh_only = true
style = "bold blue"
format = '@[$hostname]($style) '

[directory]
style = "bold blue"
format = '[$path]($style)'
truncation_length = 2
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
style = "bold purple"
format = '[$symbol$branch]($style) '

[git_status]
disabled = true

[line_break]
disabled = false

[character]
disabled = true
